version: "3.9"

services:
  db:
    image: postgres:15
    container_name: e-learning-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DJANGO_DB_USER}
      POSTGRES_PASSWORD: ${DJANGO_DB_PASSWORD}
      POSTGRES_DB: ${DJANGO_DB_NAME}
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db-init:/docker-entrypoint-initdb.d:ro
    networks:
      - e-learning-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: e-learning-backend
    volumes:
      - ./backend:/app
      - backend_data:/data
    env_file:
      - .env
    ports:
      - "8001:8001"
    depends_on:
      - db
    networks:
      - e-learning-net

  frontend:
    build:
      context: ./frontend/shp-learners
      dockerfile: Dockerfile
    container_name: e-learning-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/shp-learners:/app
    env_file:
      - .env
    depends_on:
      - backend
    networks:
      - e-learning-net

volumes:
  postgres_data:
  backend_data:

networks:
  e-learning-net:
    driver: bridge
