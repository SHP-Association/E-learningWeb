version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: e-learning-backend
    command: python manage.py runserver 0.0.0.0:8001
    volumes:
      - ./backend:/app
    env_file:
      - .env
    ports:
      - "8001:8001"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend/shp-learners
      dockerfile: Dockerfile
    container_name: e-learning-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/shp-learners:/app
    env_file:
      - .env
    depends_on:
      - backend

  db:
    image: postgres:15
    container_name: e-learning-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sandesh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
      POSTGRES_DB: ${POSTGRES_DB:-shplearner}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
