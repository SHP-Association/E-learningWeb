version: "3.9"

services:
  postgres:
    image: timescale/timescaledb:2.9.1-pg14
    container_name: shp-learner-postgres-dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${GO_DB_NAME:-shplearner}
      POSTGRES_USER: ${GO_DB_USER:-sandesh}
      POSTGRES_PASSWORD: ${GO_DB_PASSWORD:-password123}
    restart: unless-stopped
    ports:
      - "5433:5432"
    networks:
      - shp-learner-net

volumes:
  postgres_data:

networks:
  shp-learner-net:
    driver: bridge
